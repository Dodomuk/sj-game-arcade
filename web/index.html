<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승진이의 게임 아케이드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .home-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .secret-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            border: 2px solid rgba(102, 126, 234, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            opacity: 0.3;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .secret-button:hover {
            background: rgba(102, 126, 234, 0.4);
            border-color: #667eea;
            opacity: 0.9;
            transform: scale(1.05);
        }

        .games-grid {
            display: grid;
            gap: 15px;
        }

        .game-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #f0f0f0;
        }

        .game-card:hover:not(.disabled) {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .game-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-emoji {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .game-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .game-description {
            font-size: 14px;
            color: #666;
        }

        .game-screen {
            display: none;
        }

        .game-screen.active {
            display: block;
        }

        .game-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .back-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .game-title-header {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            flex: 1;
            text-align: center;
        }

        .drama-image-container {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .drama-image-container img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .drama-options {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        .drama-option {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #333;
        }

        .drama-option:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
            transform: translateX(5px);
        }

        .drama-option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            flex: 1;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .answers-container {
            display: grid;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .answer-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-out;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 3px;
            text-align: center;
        }

        .password-input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .modal-button.submit {
            background: #667eea;
            color: white;
        }

        .modal-button.submit:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .modal-button.cancel {
            background: #e0e0e0;
            color: #333;
        }

        .modal-button.cancel:hover {
            background: #d0d0d0;
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 홈 화면 -->
        <div id="homeScreen" class="game-screen active">
            <div class="home-header">
                <h1>🎮 승진이의 게임 아케이드</h1>
                <button class="secret-button" onclick="openPasswordModal()">나는 승진이야</button>
            </div>
            <p class="subtitle">다양한 게임을 즐겨보세요!</p>
            <div class="games-grid" id="gamesList"></div>
        </div>

        <!-- 드라마 제목 맞추기 -->
        <div id="dramaTitleGame" class="game-screen">
            <div class="game-header">
                <button class="back-button" onclick="goHome()">← 돌아가기</button>
                <div class="game-title-header">🌟 드라마 제목 맞추기</div>
            </div>
            <div class="drama-image-container" id="dramaImageContainer"></div>
            <div class="drama-options" id="dramaOptions"></div>
            <div class="button-group">
                <button class="button" onclick="revealDramaAnswer()" id="revealDramaBtn">정답 공개</button>
                <button class="button" onclick="nextRound()" id="nextRoundBtn" style="display: none;">다음라운드</button>
            </div>
            <div id="dramaAnswerContainer" class="answers-container hidden"></div>
        </div>
    </div>

    <!-- 비밀번호 모달 -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">비밀번호를 입력해주세요</div>
            <input type="password" id="passwordInput" class="password-input" placeholder="****" onkeypress="if(event.key==='Enter') checkPassword()">
            <div class="error-message" id="errorMessage">잘못된 비밀번호입니다</div>
            <div class="modal-buttons">
                <button class="modal-button submit" onclick="checkPassword()">확인</button>
                <button class="modal-button cancel" onclick="closePasswordModal()">취소</button>
            </div>
        </div>
    </div>

    <script>
        const games = [
            {
                id: 'drama',
                title: '드라마 제목 맞추기',
                description: '연예인 사진을 보고 드라마 제목을 맞혀보세요!',
                emoji: '🌟',
            },
            {
                id: 'memory',
                title: '메모리 게임',
                description: '카드를 뒤집어 연예인 쌍을 찾으세요!',
                emoji: '🎴',
                disabled: true,
            },
            {
                id: 'reaction',
                title: '반응속도 게임',
                description: '빠르게 클릭하여 반응속도를 측정하세요!',
                emoji: '⚡',
                disabled: true,
            },
        ];

        const dramaData = [
            {
                image: './images/celebrity-1.jpg',
                options: ['드라마 1-1', '드라마 1-2', '드라마 1-3'],
                correct: 0,
            },
            {
                image: './images/celebrity-2.jpg',
                options: ['드라마 2-1', '드라마 2-2', '드라마 2-3'],
                correct: 1,
            },
            {
                image: './images/celebrity-3.jpg',
                options: ['드라마 3-1', '드라마 3-2', '드라마 3-3'],
                correct: 2,
            },
        ];

        let currentRound = 0;
        let selectedAnswer = null;
        const PASSWORD = '0629';

        function initHome() {
            const gamesList = document.getElementById('gamesList');
            gamesList.innerHTML = games.map(game => `
                <div class="game-card ${game.disabled ? 'disabled' : ''}" ${!game.disabled ? `onclick="openGame('${game.id}')"` : ''}>
                    <div class="game-emoji">${game.emoji}</div>
                    <div class="game-title">${game.title}</div>
                    <div class="game-description">${game.description}</div>
                </div>
            `).join('');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.game-screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goHome() {
            showScreen('homeScreen');
        }

        function openGame(gameId) {
            if (gameId === 'drama') {
                initDramaGame();
                showScreen('dramaTitleGame');
            }
        }

        function initDramaGame() {
            currentRound = 0;
            loadDramaRound();
        }

        function loadDramaRound() {
            if (currentRound >= dramaData.length) {
                currentRound = 0;
            }

            const data = dramaData[currentRound];
            selectedAnswer = null;

            const imageContainer = document.getElementById('dramaImageContainer');
            imageContainer.innerHTML = `<img src="${data.image}" alt="드라마">`;

            const optionsContainer = document.getElementById('dramaOptions');
            optionsContainer.innerHTML = data.options.map((option, index) => `
                <div class="drama-option" onclick="selectAnswer(${index})" id="option-${index}">${option}</div>
            `).join('');

            document.getElementById('revealDramaBtn').style.display = 'block';
            document.getElementById('nextRoundBtn').style.display = 'none';
            document.getElementById('dramaAnswerContainer').classList.add('hidden');
        }

        function selectAnswer(index) {
            selectedAnswer = index;
            document.querySelectorAll('.drama-option').forEach((el, i) => {
                if (i === index) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
        }

        function revealDramaAnswer() {
            const data = dramaData[currentRound];
            const answerContainer = document.getElementById('dramaAnswerContainer');
            const correct = selectedAnswer === data.correct;

            answerContainer.innerHTML = `
                <div class="answer-card" style="background: ${correct ? 'linear-gradient(135deg, #4caf50 0%, #388e3c 100%)' : 'linear-gradient(135deg, #d32f2f 0%, #c62828 100%)'}">
                    ${correct ? '✅ 정답입니다!' : '❌ 오답입니다'}
                </div>
                <div class="answer-card">정답: ${data.options[data.correct]}</div>
            `;

            answerContainer.classList.remove('hidden');
            document.getElementById('revealDramaBtn').style.display = 'none';
            document.getElementById('nextRoundBtn').style.display = 'block';
        }

        function nextRound() {
            currentRound++;
            if (currentRound < dramaData.length) {
                loadDramaRound();
            } else {
                alert('모든 라운드를 완료했습니다!');
                goHome();
            }
        }

        function openPasswordModal() {
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('passwordInput').focus();
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
        }

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === PASSWORD) {
                closePasswordModal();
                showAllAnswers();
            } else {
                document.getElementById('errorMessage').classList.add('show');
                document.getElementById('passwordInput').value = '';
            }
        }

        function showAllAnswers() {
            alert('모든 정답:\n\n' + dramaData.map((data, i) =>
                `라운드 ${i + 1}: ${data.options[data.correct]}`
            ).join('\n'));
        }

        window.onclick = function(event) {
            const modal = document.getElementById('passwordModal');
            if (event.target === modal) {
                closePasswordModal();
            }
        }

        initHome();
    </script>
</body>
</html>
